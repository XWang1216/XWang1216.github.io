  location: Gothenburg, Sweden
  image: ""
  summary: >-
    I am a postdoctoral researcher in the Department of Computer Science and
    Engineering at Chalmers University of Technology, Sweden. My research lies
    at the intersection of machine learning and optimization, focusing on
    LLM agents for research automation, graph learning for combinatorial
    optimization, evolutionary computation and metaheuristics, and large-scale
    multi-objective optimization. At Chalmers, I work with [Dr. Yinan Yu](https://yinan16.github.io/).

